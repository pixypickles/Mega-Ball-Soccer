<script>

  {color:'#2d7ff9',accent:'#d9ecff'},
  {color:'#e44747',accent:'#ffe2e2'},
  {color:'#37bfd0',accent:'#ddfbff'},
  {color:'#ec62a4',accent:'#ffe1f0'},
  {color:'#263b72',accent:'#dce5ff'}
];
let selectedTeam=0,cpuTeam=1,matchMode=1,assetsReady=true;

    const b=document.createElement('button');
    b.type='button'; b.className='team-card'+(i===0?' selected':'');
    b.setAttribute('aria-label',`色 ${i+1}`);

    teamSelect.appendChild(b);

}
function makePlayer(side,x,y,teamIndex){return{side,teamIndex,x,y,z:0,vx:0,vy:0,vz:0,r:24,aimX:side?-1:1,aimY:0,kickCd:0,kickFx:0,jumpCd:0,jumpPrep:0,pendingJump:false,stun:0,down:0,inv:1.5,kickGuard:0,aiKickWait:side?1.65:0,crush:0,slide:0,slideCd:0,slideDirX:side?-1:1,slideDirY:0,slideHits:new Set(),slideBallHit:false,dash:0,dashCd:0,dashDirX:side?-1:1,dashDirY:0,dashJump:0,dropkick:0,dropkickPower:0}}
function makeKeeper(side,x,y){return{side,x,y,homeX:x,homeY:y,z:0,vx:0,vy:0,vz:0,r:28,down:0,stun:0,inv:0,dive:0,jumpCd:0,crush:0}}
let ball,players,keepers,effects=[],kickoffGrace=0;
function reset(afterGoal=false){ball={x:500,y:310,z:0,vx:0,vy:0,vz:0,r:55,spin:0,squash:0,squashAngle:Math.PI/2,special:0,powerTier:0};players=matchMode===2?[makePlayer(0,255,250,selectedTeam),makePlayer(0,255,370,selectedTeam),makePlayer(1,745,250,cpuTeam),makePlayer(1,745,370,cpuTeam)]:[makePlayer(0,270,310,selectedTeam),makePlayer(1,730,310,cpuTeam)];keepers=[makeKeeper(0,72,310),makeKeeper(1,928,310)];effects=[];kickoffGrace=afterGoal?1.25:1.8;}
function start(){if(!assetsReady)return;cpuTeam=(selectedTeam+1+Math.floor(Math.random()*(TEAM_DEFS.length-1)))%TEAM_DEFS.length;score=[0,0];time=90;message='KICK OFF!';messageLife=1.8;reset();running=true;last=performance.now();menu.style.display='none';touchUi.hidden=false;requestAnimationFrame(loop)}
function inputVector(){let x=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+joy.x,y=(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0)+joy.y;const d=Math.hypot(x,y);return d>1?{x:x/d,y:y/d}:{x,y}}
function kick(p,variant='normal'){
  if(p.kickCd>0||p.down>0||p.stun>0||p.slide>0||p.dropkick>0)return;
  p.kickCd=.25;p.kickFx=.2;
  const dx=ball.x-p.x,dy=ball.y-p.y,dist=Math.hypot(dx,dy),dz=ball.z-(p.z+20);
  const assist=p.side?50:72;
  if(dist>p.r+ball.r+assist||Math.abs(dz)>135)return;
  let dir=norm(p.aimX,p.aimY);
  const speed=Math.hypot(ball.vx,ball.vy),incoming=ball.vx*(p.x-ball.x)+ball.vy*(p.y-ball.y)>0;
  const just=incoming&&dist<p.r+ball.r+(p.side?24:42)&&speed>150;
  if(just){const back=norm(-ball.vx,-ball.vy);dir=norm(dir.x*.4+back.x*.6,dir.y*.4+back.y*.6)}
  else if(!p.side&&Math.hypot(p.aimX,p.aimY)<.2){dir={x:1,y:0}}
  const dashKick=variant==='dash';
  const power=(p.side?330:365)*(just?1.22:1)*(dashKick?1.28:1);
  ball.vx=dir.x*power;ball.vy=dir.y*power;ball.vz=(just?505+(p.z>0?100:0):405+(p.z>0?120:0))+(dashKick?90:0);
  ball.squash=.14;ball.squashAngle=Math.atan2(ball.vy,ball.vx);ball.special=(just||dashKick)?.5:0;ball.powerTier=just?3:(dashKick?2:1);
  const recoil=just?340:(dashKick?390:260);p.vx-=dir.x*recoil;p.vy-=dir.y*recoil;p.dash=0;
  if(p.z>0){p.vz=Math.min(p.vz,20);p.vx-=dir.x*35;p.vy-=dir.y*35}
  p.stun=Math.max(p.stun,just?.68:.56);p.inv=Math.max(p.inv,p.stun+.28);p.kickGuard=.08;
  effects.push({x:ball.x,y:ball.y,life:.35,max:.35,just});
  if(just){message='JUST KICK!';messageLife=.55}else if(dashKick){message='DASH KICK!';messageLife=.45}
}
function startDash(p,input){
  if(p.dashCd>0||p.dash>0||p.down>0||p.stun>0||p.slide>0||p.dropkick>0)return;
  let dir=norm(input.x,input.y);
  if(Math.hypot(input.x,input.y)<.15)dir=norm(p.aimX||(p.side?-1:1),p.aimY||0);
  p.dash=.28;p.dashCd=.72;p.dashDirX=dir.x;p.dashDirY=dir.y;p.aimX=dir.x;p.aimY=dir.y;
  p.vx=dir.x*650;p.vy=dir.y*650;
}
function startDropKick(p){
  if(p.z<8||p.dropkick>0||p.down>0||p.stun>0)return;
  let dir=norm(p.vx,p.vy);if(Math.hypot(p.vx,p.vy)<80)dir=norm(p.aimX||(p.side?-1:1),p.aimY||0);
  const superMove=p.dashJump>0;
  p.dropkick=.48;p.dropkickPower=superMove?4:3;p.slideDirX=dir.x;p.slideDirY=dir.y;p.slideHits=new Set();p.slideBallHit=false;
  p.vx=dir.x*(superMove?980:790);p.vy=dir.y*(superMove?980:790);p.vz=Math.min(p.vz,-80);p.inv=Math.max(p.inv,.55);
  message=superMove?'SUPER DROP KICK!':'DROP KICK!';messageLife=.65;
}
function startSlide(p,dashVariant=false){
  if(p.z>8){startDropKick(p);return}
  if(p.slideCd>0||p.slide>0||p.down>0||p.stun>0)return;
  let tx=ball.x,ty=ball.y;
  const ballDist=Math.hypot(ball.x-p.x,ball.y-p.y);
  if(ballDist>315){
    const candidates=[...players.filter(x=>x!==p&&x.side!==p.side),...keepers.filter(x=>x.side!==p.side)];
    let best=null,bestD=Infinity;
    for(const x of candidates){if(x.down>0)continue;const d=Math.hypot(x.x-p.x,x.y-p.y);if(d<bestD){best=x;bestD=d}}
    if(best){tx=best.x;ty=best.y}
  }
  let dir=norm(tx-p.x,ty-p.y);
  if(Math.hypot(tx-p.x,ty-p.y)<1)dir={x:p.aimX||(p.side?-1:1),y:p.aimY||0};
  p.slide=dashVariant?.58:.46;p.slideCd=1.05;p.slideDirX=dir.x;p.slideDirY=dir.y;p.slideHits=new Set();p.slideBallHit=false;p.dash=0;
  p.vx=dir.x*(dashVariant?930:760);p.vy=dir.y*(dashVariant?930:760);p.aimX=dir.x;p.aimY=dir.y;p.inv=Math.max(p.inv,.5);
}
function slideCollisions(p){
  if(p.slide<=0&&p.dropkick<=0)return;
  const dir={x:p.slideDirX,y:p.slideDirY},drop=p.dropkick>0,power=drop?p.dropkickPower:2;
  if(!p.slideBallHit&&Math.abs(ball.z-p.z)<105&&Math.hypot(ball.x-p.x,ball.y-p.y)<p.r+ball.r+18){
    p.slideBallHit=true;
    const shot=drop?(power>=4?780:620):410;ball.vx=dir.x*shot;ball.vy=dir.y*shot;ball.vz=Math.max(drop?(power>=4?760:610):455,Math.abs(ball.vz)*.35+340);
    ball.powerTier=power;ball.special=.18;ball.squash=.17;ball.squashAngle=Math.atan2(dir.y,dir.x);
    const recoil=drop?(power>=4?980:820):570;p.vx=-dir.x*recoil;p.vy=-dir.y*recoil;p.vz=drop?280:170;p.inv=Math.max(p.inv,.58);p.slide=Math.max(p.slide,.34);if(drop){p.dropkick=.34;p.down=Math.max(p.down,.78)}
  }
  const targets=[...players.filter(x=>x!==p&&x.side!==p.side),...keepers.filter(x=>x.side!==p.side)];
  for(const t of targets){
    if(p.slideHits.has(t))continue;
    if(Math.abs((t.z||0)-p.z)>80)continue;
    if(Math.hypot(t.x-p.x,t.y-p.y)>p.r+t.r+22)continue;

    t.down=Math.max(t.down,drop?1.05:.78);t.stun=0;t.inv=Math.max(t.inv,1.0);t.vx=dir.x*(drop?820:620);t.vy=dir.y*(drop?820:620);t.vz=Math.max(t.vz||0,drop?310:220);
    if('dive' in t)t.dive=.45;
  }
}
function jump(p,dashVariant=false){if(p.jumpCd||p.down||p.stun||p.z>1||p.jumpPrep>0||p.dropkick>0)return;p.jumpPrep=dashVariant?.06:.11;p.pendingJump=dashVariant?'dash':true;p.jumpCd=.48;if(dashVariant){p.dashJump=.65;p.vx=p.dashDirX*690;p.vy=p.dashDirY*690;p.dash=0}}
function movePlayer(p,dt,input){
  p.kickCd=Math.max(0,p.kickCd-dt);p.kickFx=Math.max(0,p.kickFx-dt);p.jumpCd=Math.max(0,p.jumpCd-dt);p.slideCd=Math.max(0,p.slideCd-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.dash=Math.max(0,p.dash-dt);p.dashJump=Math.max(0,p.dashJump-dt);p.dropkick=Math.max(0,p.dropkick-dt);
  p.stun=Math.max(0,p.stun-dt);p.down=Math.max(0,p.down-dt);p.inv=Math.max(0,p.inv-dt);p.kickGuard=Math.max(0,p.kickGuard-dt);p.crush=Math.max(0,p.crush-dt);
  if(p.slide>0){p.slide=Math.max(0,p.slide-dt);p.vx*=Math.pow(.965,dt*60);p.vy*=Math.pow(.965,dt*60)}if(p.dropkick>0){p.vx*=Math.pow(.982,dt*60);p.vy*=Math.pow(.982,dt*60)}if(p.dash>0){p.vx=p.dashDirX*650;p.vy=p.dashDirY*650}
  if(p.jumpPrep>0){p.jumpPrep-=dt;if(p.jumpPrep<=0&&p.pendingJump){const dj=p.pendingJump==='dash';p.pendingJump=false;p.vz=dj?805:735}}
  if(p.down>0){p.vx*=Math.pow(.89,dt*60);p.vy*=Math.pow(.89,dt*60)}
  else if(p.stun>0){p.vx*=Math.pow(.86,dt*60);p.vy*=Math.pow(.86,dt*60)}
  else if(p.slide<=0&&p.dropkick<=0&&p.dash<=0&&p.jumpPrep<=0){const speed=285;p.vx+=(input.x*speed-p.vx)*Math.min(1,dt*12);p.vy+=(input.y*speed-p.vy)*Math.min(1,dt*12);if(Math.hypot(input.x,input.y)>.1){p.aimX=input.x;p.aimY=input.y}}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vz-=1480*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;p.vz=0}
  p.x=clamp(p.x,110,890);p.y=clamp(p.y,TOP+25,BOTTOM-25)
}
function cpu(p,dt){
  p.aiKickWait=Math.max(0,p.aiKickWait-dt);
  const attackDir=p.side?-1:1;
  const supportOffset=p.side?-55:55;
  const tx=ball.x+(ball.vx*.08)+(p.side?(ball.x<300?72:-10):(ball.x>700?-72:10))+supportOffset*.12;
  const ty=ball.y+ball.vy*.08;
  const n=norm(tx-p.x,ty-p.y),d=Math.hypot(ball.x-p.x,ball.y-p.y);
  const lowEnough=ball.z<86||(p.z>18&&ball.z-p.z<82),kickRange=p.r+ball.r+58;
  if(kickoffGrace<=0&&p.stun<=0&&p.down<=0&&p.slide<=0&&lowEnough&&d<kickRange&&p.kickCd<=0&&p.aiKickWait<=0){p.aimX=attackDir;p.aimY=clamp((310-ball.y)/220,-.42,.42);kick(p);p.aiKickWait=.58+Math.random()*.24;return{x:0,y:0}}

}
function hitPerson(p,keeper=false){
  if(p.inv>0)return;
  const dx=p.x-ball.x,dy=p.y-ball.y,d=Math.hypot(dx,dy),m=p.r+ball.r;

  const speed=Math.hypot(ball.vx,ball.vy),o=m-d,strong=(ball.powerTier||0)>=3;
  const overhead=ball.vz<-90&&ball.z>p.z+48&&Math.abs(ball.x-p.x)<p.r+ball.r*.58&&Math.abs(ball.y-p.y)<p.r+ball.r*.58;
  if(overhead){
    p.crush=.24;p.down=keeper?1.2:1.35;p.inv=p.down+.35;p.stun=0;
    p.z=0;p.vz=0;p.vx*=.18;p.vy*=.18;
    ball.vz=Math.max(210,Math.abs(ball.vz)*.42);ball.vx*=.72;ball.vy*=.72;ball.squash=.22;ball.squashAngle=Math.PI/2;ball.powerTier=Math.max(ball.powerTier,1);
    return;
  }
  p.x+=n.x*o*.72;p.y+=n.y*o*.72;
  // ほぼ停止中でも、巨大ボールに触れた人は必ず少し押し返される。
  const impactSpeed=Math.max(speed,48);

  // 人体の丸みに沿って跳ね返し、毎回まったく同じ軌道にならないよう接触位置も反映する。
  const dot=ball.vx*n.x+ball.vy*n.y;

  const tangent={x:-n.y,y:n.x};
  const offset=clamp((ball.y-p.y)/(m||1),-1,1);
  const deflect=(58+impactSpeed*.14)*offset;
  rvx+=tangent.x*deflect;rvy+=tangent.y*deflect;
  const reflected=norm(rvx,rvy),rebound=impactSpeed*(keeper?.52:.64);
  ball.vx=reflected.x*rebound;ball.vy=reflected.y*rebound;
  ball.vz=Math.max(ball.vz,keeper?(strong?330:205):(strong?300:185));
  ball.squash=.18;ball.squashAngle=Math.atan2(n.y,n.x);

  // ジャンプ中のキーパーは、球威に関係なくセーブの反動でゴールと反対側へ大きく飛ばされる。
  const airborneKeeperSave=keeper&&p.z>8;
  if(airborneKeeperSave){
    const hs=Math.max(impactSpeed,180);
    p.down=1.08;p.inv=1.38;p.stun=0;p.dive=.5;
    p.vx=n.x*clamp(430+hs*.55,500,760);p.vy=n.y*clamp(330+hs*.46,390,650);
    p.vz=Math.max(315,p.vz*.25);
  }else if(strong){
    const hs=Math.max(impactSpeed,275);
    p.down=keeper?1.22:clamp(.68+hs/610,.82,1.52);
    p.inv=p.down+.32;
    p.vx=n.x*clamp(hs*1.28,430,760);p.vy=n.y*clamp(hs*1.28,430,760);
    p.vz=keeper?315:(p.z>18?390:255);
  }else{
    p.stun=keeper?.62:.56;
    p.inv=p.stun+.34;
    p.vx=n.x*clamp(300+impactSpeed*.58,350,540);p.vy=n.y*clamp(300+impactSpeed*.58,350,540);
    if(p.side&&!keeper){p.aiKickWait=0;p.kickCd=Math.min(p.kickCd,.08)}
    // 弱い球でも十分に距離を取らせ、同じ場所でよろけ続ける状態を防ぐ。
    if(p.z>18)p.vz=Math.max(p.vz,keeper?145:105);
  }
}
function keeper(k,dt){
  k.down=Math.max(0,k.down-dt);k.stun=Math.max(0,k.stun-dt);k.inv=Math.max(0,k.inv-dt);k.jumpCd=Math.max(0,k.jumpCd-dt);k.crush=Math.max(0,k.crush-dt);
  if(k.down>0){k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=Math.pow(.9,dt*60);k.vy*=Math.pow(.9,dt*60)}
  else if(k.stun>0){k.x+=k.vx*dt;k.y+=k.vy*dt;k.vx*=Math.pow(.82,dt*60);k.vy*=Math.pow(.82,dt*60);k.dive=Math.max(k.dive,.12)}
  else{
    const toward=k.side?ball.vx>0:ball.vx<0,close=k.side?ball.x>650:ball.x<350;
    const predictY=ball.y+ball.vy*.16,target=toward&&close?clamp(predictY,GOAL_TOP+18,GOAL_BOTTOM-18):k.homeY;
    k.vy=clamp((target-k.y)*8.5,-500,500);
    const highBall=toward&&close&&ball.z>72&&ball.z<300&&Math.abs(predictY-k.y)<135;
    if(highBall&&k.z<2&&k.jumpCd<=0){k.vz=565;k.vx=k.side?-115:115;k.jumpCd=.78;k.dive=.5}
    k.dive=(Math.abs(k.vy)>170||k.z>1)?.22:Math.max(0,k.dive-dt);k.y+=k.vy*dt;k.x+=k.vx*dt;k.vx*=Math.pow(.88,dt*60);k.x+=(k.homeX-k.x)*Math.min(1,dt*4)
  }
  k.vz-=1400*dt;k.z+=k.vz*dt;if(k.z<0){k.z=0;k.vz=0}
  k.y=clamp(k.y,GOAL_TOP+18,GOAL_BOTTOM-18);k.x=clamp(k.x,k.side?850:45,k.side?955:150);hitPerson(k,true)
}
function ballUpdate(dt){
  ball.vz-=1280*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.z+=ball.vz*dt;
  // 横方向は重い芝上の大玉らしく、蹴った直後から目に見えて減速する。
  ball.vx*=Math.pow(.982,dt*60);ball.vy*=Math.pow(.982,dt*60);ball.spin+=Math.hypot(ball.vx,ball.vy)*dt*.007;
  ball.squash=Math.max(0,ball.squash-dt);ball.special=Math.max(0,ball.special-dt);
  if(ball.z<GROUND){ball.z=GROUND;if(Math.abs(ball.vz)>95){ball.vz=-ball.vz*.60;ball.squash=.12;ball.squashAngle=Math.PI/2}else ball.vz=0;ball.vx*=.93;ball.vy*=.93}
  if(ball.y-ball.r<TOP){ball.y=TOP+ball.r;ball.vy=Math.abs(ball.vy)*.84;ball.squash=.1;ball.squashAngle=Math.PI/2}
  if(ball.y+ball.r>BOTTOM){ball.y=BOTTOM-ball.r;ball.vy=-Math.abs(ball.vy)*.84;ball.squash=.1;ball.squashAngle=Math.PI/2}
  const mouth=ball.y>GOAL_TOP&&ball.y<GOAL_BOTTOM;
  const canEnter=mouth&&ball.z<GOAL_HEIGHT;
  // ゴール口でもクロスバーより高い球は、ゴール側の壁でフィールドへ跳ね返す。
  if(!canEnter){
    if(ball.x-ball.r<45){ball.x=45+ball.r;ball.vx=Math.abs(ball.vx)*.78;ball.vz=Math.max(ball.vz,55);ball.squash=.12;ball.squashAngle=0}
    else if(ball.x+ball.r>955){ball.x=955-ball.r;ball.vx=-Math.abs(ball.vx)*.78;ball.vz=Math.max(ball.vz,55);ball.squash=.12;ball.squashAngle=0}
  }
  if(canEnter){if(ball.x<-15)goal(1);else if(ball.x>1015)goal(0)}
  if(Math.hypot(ball.vx,ball.vy)<45&&ball.z<8)ball.powerTier=0;
}
function goal(team){score[team]++;message=team===0?'GOAL!':'CPU GOAL';messageLife=1.4;if(score[team]>=3){running=false;setTimeout(()=>showMenu(team===0?'勝利！ 同じチームでもう一度遊べます。':'敗北… チームを選び直して再挑戦！'),900)}else reset(true)}
function showMenu(text){menu.style.display='grid';touchUi.hidden=true;menuMessage.textContent=text}
function update(dt){time=Math.max(0,time-dt);kickoffGrace=Math.max(0,kickoffGrace-dt);messageLife=Math.max(0,messageLife-dt);effects.forEach(e=>e.life-=dt);effects=effects.filter(e=>e.life>0);const p=players[0],inp=inputVector();movePlayer(p,dt,inp);if(pressed.has('KeyI'))startDash(p,inp);if(pressed.has('KeyJ'))kick(p,p.dash>0?'dash':'normal');if(pressed.has('KeyK'))jump(p,p.dash>0);if(pressed.has('KeyL'))startSlide(p,p.dash>0);for(let i=1;i<players.length;i++){const ai=cpu(players[i],dt);movePlayer(players[i],dt,ai)}players.forEach(slideCollisions);ballUpdate(dt);players.forEach(x=>hitPerson(x));keepers.forEach(k=>keeper(k,dt));pressed.clear();if(time<=0){running=false;message=score[0]===score[1]?'DRAW':score[0]>score[1]?'WIN!':'LOSE';setTimeout(()=>showMenu(score[0]===score[1]?'引き分け。もう一度スタートできます。':score[0]>score[1]?'勝利！ もう一度スタートできます。':'敗北… 再挑戦！'),900)}}
function drawField(){ctx.fillStyle='#183d31';ctx.fillRect(0,0,W,H);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#1d4939':'#20503e';ctx.fillRect(i*100,TOP,100,BOTTOM-TOP)}ctx.strokeStyle='#dbeed5aa';ctx.lineWidth=5;ctx.strokeRect(45,TOP,910,BOTTOM-TOP);ctx.beginPath();ctx.moveTo(500,TOP);ctx.lineTo(500,BOTTOM);ctx.stroke();ctx.beginPath();ctx.arc(500,310,88,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#cfe8dd18';ctx.fillRect(45,GOAL_TOP,95,GOAL_BOTTOM-GOAL_TOP);ctx.fillRect(860,GOAL_TOP,95,GOAL_BOTTOM-GOAL_TOP);ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.strokeRect(4,GOAL_TOP,42,GOAL_BOTTOM-GOAL_TOP);ctx.strokeRect(954,GOAL_TOP,42,GOAL_BOTTOM-GOAL_TOP)}
function shadow(x,y,z,r){ctx.fillStyle=`rgba(0,0,0,${.28-clamp(z/600,0,.18)})`;ctx.beginPath();ctx.ellipse(x,y+r*.7,r*(1-z/900),r*.28*(1-z/900),0,0,Math.PI*2);ctx.fill()}
function playerState(p){if(p.crush>0)return'crush';if(p.dropkick>0)return'dropkick';if(p.slide>0)return'slide';if(p.down>0)return p.z>8?'fly':'down';if(p.stun>0)return'stumble';if(p.kickFx>0)return'kick';if(p.jumpPrep>0)return'jump_prep';if(p.z>1)return'jump';if(p.dash>0)return'dash';if(Math.hypot(p.vx,p.vy)>55)return'run';return'idle'}
function roundRectPath(x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function limb(x1,y1,x2,y2,width,color='#202733'){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function shoe(x,y,dir=1,scale=1,color='#f5f7fb'){ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.fillStyle='#131923';ctx.beginPath();ctx.ellipse(9*scale,0,20*scale,11*scale,-.12,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(7*scale,-3*scale,15*scale,7*scale,-.12,0,Math.PI*2);ctx.fill();ctx.restore()}
function glove(x,y,dir=1,scale=1,color='#ffd24a'){ctx.save();ctx.translate(x,y);ctx.scale(dir,1);ctx.fillStyle='#202733';ctx.beginPath();ctx.ellipse(0,0,18*scale,15*scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(2*scale,-1*scale,14*scale,11*scale,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawFace(x,y,dir=1,scale=1){ctx.fillStyle='#f4c69a';ctx.strokeStyle='#202733';ctx.lineWidth=4*scale;ctx.beginPath();ctx.arc(x,y,25*scale,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#202733';ctx.beginPath();ctx.arc(x+dir*8*scale,y-3*scale,2.8*scale,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x-dir*7*scale,y-3*scale,2.8*scale,0,Math.PI*2);ctx.fill()}
function drawFieldPlayer(p){const state=playerState(p),dir=p.aimX>=0?1:-1,t=TEAM_DEFS[p.teamIndex],baseY=p.y-p.z;if(state!=='fly'&&state!=='down'&&state!=='crush')shadow(p.x,p.y,p.z,p.r);ctx.save();ctx.translate(p.x,baseY);ctx.scale(dir,1);if(state==='crush'){ctx.strokeStyle='#202733';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-43,2);ctx.lineTo(43,2);ctx.stroke();ctx.restore();return}if(state==='slide'||state==='dropkick'){ctx.rotate(state==='dropkick'?-0.18:-.08);drawFace(-18,-58,1,.9);ctx.fillStyle=t.color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-27,-46,56,35,12);ctx.fill();ctx.stroke();/* 前脚はまっすぐ伸ばす */limb(18,-13,66,-8,12);shoe(76,-8,1,1.16,t.accent);/* 後脚は膝を大きく曲げる */limb(-13,-14,-34,9,11);limb(-34,9,-8,24,11);shoe(-1,25,1,1.05,t.accent);limb(-21,-36,-45,-48,9);limb(22,-35,43,-22,9);ctx.restore();return}if(state==='down'){ctx.rotate(-.08);drawFace(-18,-14,1,.9);ctx.fillStyle=t.color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-3,-29,55,35,13);ctx.fill();ctx.stroke();limb(37,-8,64,-3,12);shoe(68,-2,1,.92,t.accent);shoe(-35,4,-1,.92,t.accent);ctx.restore();return}if(state==='fly'){ctx.rotate(-.32);drawFace(-12,-72,1,.92);ctx.fillStyle=t.color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-18,-57,45,47,13);ctx.fill();ctx.stroke();limb(-8,-12,-36,12,10);limb(17,-13,43,8,10);shoe(-40,13,-1,.95,t.accent);shoe(48,9,1,.95,t.accent);ctx.restore();return}let headY=-91,bodyY=-65,bodyH=50;if(state==='jump_prep'){headY=-70;bodyY=-52;bodyH=42;ctx.translate(0,8)}if(state==='stumble'){ctx.rotate(-.18);ctx.translate(-5,0)}drawFace(0,headY,1,1);ctx.fillStyle=t.color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-23,bodyY,46,bodyH,13);ctx.fill();ctx.stroke();ctx.fillStyle=t.accent;ctx.fillRect(-18,bodyY+24,36,8);if(state==='kick'){limb(-13,-16,-25,0,10);shoe(-30,2,-1,1,t.accent);limb(12,-17,48,-38,11);shoe(57,-42,1,1.1,t.accent);limb(-20,bodyY+13,-39,bodyY+28,9);limb(20,bodyY+12,36,bodyY+2,9)}else if(state==='dash'){limb(-12,-16,-43,-5,11);limb(12,-16,43,5,11);shoe(-49,-3,-1,1.12,t.accent);shoe(49,7,1,1.12,t.accent);limb(-20,bodyY+12,-48,bodyY+3,10);limb(20,bodyY+12,48,bodyY+24,10)}else if(state==='run'){const phase=Math.sin(performance.now()*.025+p.x*.03);limb(-11,-16,-31,phase*10,10);limb(11,-16,31,-phase*10,10);shoe(-36,phase*10+2,-1,1.08,t.accent);shoe(36,-phase*10+2,1,1.08,t.accent);limb(-20,bodyY+12,-37,bodyY+26,9);limb(20,bodyY+12,38,bodyY+2,9)}else if(state==='jump'){limb(-10,-16,-31,-4,10);limb(10,-16,31,-4,10);shoe(-36,-3,-1,1.05,t.accent);shoe(36,-3,1,1.05,t.accent);limb(-19,bodyY+14,-37,bodyY-2,9);limb(19,bodyY+14,37,bodyY-2,9)}else if(state==='stumble'){limb(-11,-16,-32,5,10);limb(11,-16,35,-1,10);shoe(-37,7,-1,1.06,t.accent);shoe(40,1,1,1.06,t.accent);limb(-20,bodyY+13,-39,bodyY+2,9);limb(20,bodyY+13,39,bodyY+25,9)}else{limb(-11,-16,-25,2,10);limb(11,-16,25,2,10);shoe(-30,4,-1,1.05,t.accent);shoe(30,4,1,1.05,t.accent);limb(-20,bodyY+13,-32,bodyY+28,9);limb(20,bodyY+13,32,bodyY+28,9)}ctx.restore()}
function drawKeeper(p){const state=p.crush>0?'crush':p.down>0?(p.z>6?'dive':'down'):(p.dive>0||p.z>1?'dive':'idle'),dir=p.side?-1:1,baseY=p.y-p.z,color=p.side?'#f2c742':'#e64b45';if(state!=='dive'&&state!=='down'&&state!=='crush')shadow(p.x,p.y,p.z,p.r);ctx.save();ctx.translate(p.x,baseY);ctx.scale(dir,1);if(state==='crush'){ctx.strokeStyle='#202733';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-48,2);ctx.lineTo(48,2);ctx.stroke();ctx.restore();return}if(state==='down'){drawFace(-16,-17,1,.92);ctx.fillStyle=color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-1,-33,54,37,13);ctx.fill();ctx.stroke();glove(-38,-8,-1,.95);glove(66,-5,1,.95);shoe(-36,6,-1,.9);shoe(69,6,1,.9);ctx.restore();return}if(state==='dive'){ctx.rotate(-.28);drawFace(-4,-73,1,.95);ctx.fillStyle=color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-25,-58,48,47,13);ctx.fill();ctx.stroke();limb(-14,-18,-38,6,10);limb(13,-18,39,4,10);shoe(-44,8,-1,.95);shoe(46,6,1,.95);limb(-21,-46,-58,-65,9);limb(21,-46,60,-63,9);glove(-67,-68,-1,1.15);glove(69,-66,1,1.15);ctx.restore();return}drawFace(0,-92,1,1);ctx.fillStyle=color;ctx.strokeStyle='#202733';ctx.lineWidth=4;roundRectPath(-25,-66,50,53,14);ctx.fill();ctx.stroke();limb(-12,-16,-28,2,11);limb(12,-16,28,2,11);shoe(-34,4,-1,1.05);shoe(34,4,1,1.05);limb(-22,-49,-47,-36,10);limb(22,-49,47,-36,10);glove(-57,-32,-1,1.12);glove(57,-32,1,1.12);ctx.restore()}
function drawPerson(p,keeper=false){keeper?drawKeeper(p):drawFieldPlayer(p)}
function drawBall(){shadow(ball.x,ball.y,ball.z,ball.r);ctx.save();ctx.translate(ball.x,ball.y-ball.z);const sq=ball.squash>0?Math.sin(Math.min(1,ball.squash/.18)*Math.PI)*.11:0,pulse=ball.special>0?1+Math.sin(performance.now()*.018)*.025:1;if(sq>0){ctx.rotate(ball.squashAngle||0);ctx.scale((1-sq)*pulse,(1+sq)*pulse);ctx.rotate(-(ball.squashAngle||0))}else ctx.scale(pulse,pulse);ctx.rotate(ball.spin);const grad=ctx.createRadialGradient(-18,-22,8,0,0,ball.r);grad.addColorStop(0,'#ffd27a');grad.addColorStop(.45,'#f5a53a');grad.addColorStop(1,'#d96b18');ctx.fillStyle=grad;ctx.strokeStyle='#6f340d';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#8b4c18aa';ctx.lineWidth=4;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(0,0,ball.r*.62,i*Math.PI/3+.25,i*Math.PI/3+1.05);ctx.stroke()}ctx.restore()}

function drawHud(){ctx.fillStyle='#07111dcc';ctx.fillRect(0,0,W,76);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 39px system-ui';ctx.fillText(`${score[0]}  -  ${score[1]}`,500,49);ctx.fillStyle=TEAM_DEFS[selectedTeam].color;ctx.beginPath();ctx.arc(42,27,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=TEAM_DEFS[cpuTeam].color;ctx.beginPath();ctx.arc(958,27,13,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.fillStyle='#fff8b6';ctx.font='800 18px system-ui';ctx.fillText(`${Math.ceil(time)} sec`,500,70);if(messageLife>0){ctx.font='900 52px system-ui';ctx.fillStyle='#fff';ctx.strokeStyle='#07334b';ctx.lineWidth=9;ctx.strokeText(message,500,145);ctx.fillText(message,500,145)}}
function draw(){drawField();keepers.forEach(k=>drawPerson(k,true));players.forEach(p=>drawPerson(p));drawBall();drawHud()}
function loop(now){if(!running)return;try{const dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(loop)}catch(err){running=false;console.error(err);showMenu('ゲーム処理エラーが発生しました。ページを再読み込みしてください。');}}
window.addEventListener('keydown',e=>{if(!keys.has(e.code))pressed.add(e.code);keys.add(e.code);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys.delete(e.code));
modeSelect.addEventListener('click',e=>{const b=e.target.closest('.mode-card');if(!b)return;matchMode=Number(b.dataset.mode)||1;modeSelect.querySelectorAll('.mode-card').forEach(x=>x.classList.toggle('selected',x===b));});
startButton.addEventListener('click',start);
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});document.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});
function bindButton(id,code){const b=document.getElementById(id);const on=e=>{e.preventDefault();if(!keys.has(code))pressed.add(code);keys.add(code);b.classList.add('active');try{b.setPointerCapture(e.pointerId)}catch{}};const off=e=>{e.preventDefault();keys.delete(code);b.classList.remove('active')};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)}bindButton('kickButton','KeyJ');bindButton('jumpButton','KeyK');bindButton('slideButton','KeyL');bindButton('dashButton','KeyI');
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');function joyMove(e){if(joy.pointer!==e.pointerId)return;const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.32,d=Math.hypot(dx,dy),s=d>max?max/d:1,px=dx*s,py=dy*s;joy.x=px/max;joy.y=py/max;stick.style.transform=`translate(${px}px,${py}px)`}joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.pointer=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',joyMove);function joyEnd(e){if(joy.pointer!==e.pointerId)return;joy.pointer=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
buildTeamSelect();reset();draw();requestAnimationFrame(()=>{loading.classList.add('complete');loading.querySelector('b').textContent='準備完了';setTimeout(()=>{loading.style.opacity='0';loading.style.transition='opacity .35s';setTimeout(()=>loading.hidden=true,380)},650)});
