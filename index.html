<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#152238">
<title>大玉サッカー</title>
<link rel="stylesheet" href="style.css?v=106">
</head>
<body>
<div id="app">
  <canvas id="game" width="1000" height="600" aria-label="大玉サッカー"></canvas>
  <div id="menu">
    <div class="card">
      <div class="eyebrow">BIG BALL SOCCER</div>
      <h1>大玉サッカー</h1>
      <p id="menuMessage">チームを選んで、巨大なボールを相手ゴールへ蹴り込もう！</p>
      <div id="teamSelect" class="team-select" aria-label="チーム選択"></div>
      <button id="startButton" type="button" disabled>画像読み込み中</button>
      <div class="guide">移動：左スティック　／　A：キック　B：ジャンプ　C：力溜め</div>
    </div>
  </div>
  <div id="loading" class="loading"><b>画像受信中</b><span id="loadingCount">0 / 48</span></div>
  <div id="touchUi" hidden>
    <div id="joystick"><div id="stick"></div></div>
    <div class="buttons">
      <button id="kickButton" class="action kick" type="button"><b>A</b><span>キック</span></button>
      <button id="jumpButton" class="action jump" type="button"><b>B</b><span>ジャンプ</span></button>
      <button id="chargeButton" class="action charge" type="button"><b>C</b><span>力溜め</span></button>
    </div>
  </div>
</div>
<script src="game.js?v=106"></script>
</body>
</html>
